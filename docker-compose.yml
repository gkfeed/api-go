services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      GKFEED_ADDRESS: ":8086"
      GKFEED_DB_PATH: "/data/db.sqlite"
      GKFEED_JWT_SECRET: "${GKFEED_JWT_SECRET:?set GKFEED_JWT_SECRET to a cryptographically random value of at least 32 bytes}"
    volumes:
      - ~/.local/share/gkfeed/data:/data
    restart: always
